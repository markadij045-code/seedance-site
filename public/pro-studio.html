<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeedGen PRO — студия</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050607;color:#e5e7eb;font:400 .95rem/1.5 'Inter',sans-serif;overflow:hidden}
h1,h2,h3,.logo{font-family:'Space Grotesk','Inter',sans-serif}
button{font-family:inherit}
a{color:#A3E635}
.lime{color:#A3E635}
.muted{color:#9ca3af}
/* верхняя панель */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(10,12,8,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100}
.topbar .logo{display:flex;gap:8px;align-items:center;font-weight:700;font-size:1.05rem;color:#fff;white-space:nowrap}
.navmenu{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto}
.navitem{padding:8px 14px;border:none;background:none;color:#9ca3af;font-size:.9rem;font-weight:600;cursor:pointer;border-radius:10px;white-space:nowrap}
.navitem:hover{color:#e5e7eb}
.navitem.active{color:#A3E635}
.navitem.soon{color:#4b5563;cursor:not-allowed}
.topright{display:flex;gap:8px;align-items:center}
.chip{padding:7px 12px;border-radius:999px;border:1px solid rgba(163,230,53,.35);background:rgba(163,230,53,.08);color:#A3E635;font-size:.8rem;font-weight:700;white-space:nowrap}
.btn-s{padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:none;color:#e5e7eb;font-size:.85rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-s:hover{border-color:rgba(163,230,53,.5)}
/* каркас */
.frame{position:fixed;top:56px;bottom:0;left:0;right:0;display:flex}
.rail{width:56px;border-right:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:8px;align-items:center;padding:12px 0}
.rail button{width:38px;height:38px;border-radius:12px;border:none;background:rgba(255,255,255,.06);color:#e5e7eb;font-size:1rem;cursor:pointer}
.rail button.on{background:rgba(163,230,53,.15);color:#A3E635}
.leftpanel{width:280px;border-right:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;background:#0a0c08}
.leftpanel.hidden{display:none}
.ltabs{display:flex;border-bottom:1px solid rgba(255,255,255,.08)}
.ltab{flex:1;padding:12px 0;border:none;background:none;color:#9ca3af;font-weight:600;font-size:.85rem;cursor:pointer;border-bottom:2px solid transparent}
.ltab.on{color:#A3E635;border-bottom-color:#A3E635}
.llist{flex:1;overflow-y:auto;padding:10px}
.litem{padding:10px 12px;border-radius:12px;cursor:pointer;margin-bottom:6px;border:1px solid transparent}
.litem:hover{background:rgba(255,255,255,.05)}
.litem h5{font-size:.85rem;color:#e5e7eb;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.litem p{font-size:.75rem;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.litem .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.dot.ok{background:#A3E635}.dot.gen{background:#f59e0b}.dot.err{background:#ef4444}
.lempty{color:#6b7280;font-size:.85rem;text-align:center;padding:40px 20px;line-height:1.6}
/* центр */
.center{flex:1;display:flex;flex-direction:column;min-width:0}
.stage{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.micon{font-size:3rem;margin-bottom:10px}
.mname{font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:12px}
.mdesc{max-width:640px;color:#9ca3af;font-size:.92rem;line-height:1.65;margin-bottom:16px}
.mcaps{color:#d1d5db;font-size:.85rem;font-weight:600;margin-bottom:6px}
.mcapline{color:#9ca3af;font-size:.85rem}
.mcapline b{color:#A3E635;font-weight:600}
/* промпт-бар */
.pbar{border-top:1px solid rgba(255,255,255,.08);padding:12px 16px;background:#0a0c08}
.pbox{border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(0,0,0,.4);padding:10px 12px}
.pbox textarea{width:100%;min-height:64px;max-height:180px;background:none;border:none;outline:none;color:#e5e7eb;font:400 .95rem/1.5 'Inter',sans-serif;resize:vertical}
.prow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.pchip{padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#9ca3af;font-size:.78rem;font-weight:600;cursor:pointer}
.pchip:hover{color:#e5e7eb}
.pcount{margin-left:auto;color:#6b7280;font-size:.75rem}
.psend{width:38px;height:38px;border-radius:10px;border:none;background:#A3E635;color:#000;font-size:1.05rem;font-weight:800;cursor:pointer}
.psend:disabled{opacity:.4;cursor:not-allowed}
.pprice{padding:6px 12px;border-radius:999px;background:rgba(163,230,53,.12);border:1px solid rgba(163,230,53,.4);color:#A3E635;font-weight:700;font-size:.82rem;white-space:nowrap}
.refrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.refchip{position:relative;width:44px;height:44px;border-radius:10px;overflow:hidden;border:1px solid rgba(163,230,53,.35)}
.refchip img{width:100%;height:100%;object-fit:cover}
.refchip button{position:absolute;top:1px;right:1px;width:16px;height:16px;border:none;border-radius:50%;background:rgba(0,0,0,.75);color:#fca5a5;font-size:.6rem;cursor:pointer}
/* правая панель */
.rightpanel{width:320px;border-left:1px solid rgba(255,255,255,.07);overflow-y:auto;padding:16px;background:#0a0c08}
.rblock{border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,.02)}
.rblock h4{font-size:.85rem;color:#d1d5db;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.rrow{margin-bottom:12px}
.rrow:last-child{margin-bottom:0}
.rrow label{display:block;font-size:.78rem;color:#6b7280;margin-bottom:6px}
.rrow select{width:100%;padding:10px 12px;background:#111410;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#e5e7eb;font-size:.88rem;outline:none}
.rrow select:focus{border-color:rgba(163,230,53,.5)}
.toggle{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.toggle .sw{width:40px;height:22px;border-radius:999px;background:rgba(255,255,255,.15);position:relative;cursor:pointer;flex:0 0 auto;transition:.2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on .sw{background:#A3E635}
.toggle.on .sw::after{left:21px;background:#000}
.toggle .tt{font-size:.85rem;color:#e5e7eb;font-weight:600}
.toggle .td{font-size:.75rem;color:#6b7280}
.resetbtn{width:100%;padding:9px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:none;color:#9ca3af;font-size:.82rem;cursor:pointer}
.resetbtn:hover{color:#e5e7eb}
/* статус и модалки */
.statusbar{position:fixed;left:0;right:0;bottom:0;background:#0a0c08;border-top:1px solid rgba(163,230,53,.3);padding:12px 20px;display:none;align-items:center;gap:16px;z-index:200}
.statusbar.show{display:flex}
.statusbar .st{color:#A3E635;font-weight:600;font-size:.9rem;white-space:nowrap}
.pbar2{flex:1;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.pfill{height:100%;width:40%;background:#A3E635;animation:run 1.6s infinite}
@keyframes run{0%{margin-left:-40%}100%{margin-left:100%}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:300;padding:20px}
.modal.show{display:flex}
.mbox{background:#101308;border:1px solid rgba(163,230,53,.35);border-radius:20px;padding:26px;max-width:860px;width:100%;max-height:88vh;overflow-y:auto;position:relative}
.mbox video,.mbox img{width:100%;border-radius:14px;margin-bottom:16px}
.mbox audio{width:100%;margin-bottom:16px}
.mclose{position:absolute;top:12px;right:14px;border:none;background:none;color:rgba(255,255,255,.5);font-size:1.3rem;cursor:pointer}
.mactions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.login{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;z-index:400;padding:20px}
.login.hidden{display:none}
.loginbox{background:#101308;border:1px solid rgba(163,230,53,.35);border-radius:24px;padding:36px;max-width:420px;width:100%;text-align:center}
.loginbox h2{color:#fff;font-size:1.5rem;margin-bottom:10px}
.loginbox p{color:#9ca3af;font-size:.88rem;margin-bottom:20px;line-height:1.5}
.loginbox input{width:100%;padding:13px 16px;background:#050607;border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1rem;outline:none;margin-bottom:10px}
.loginbox input:focus{border-color:#A3E635}
.loginbox button{width:100%;padding:13px;border:none;border-radius:12px;background:#A3E635;color:#000;font-weight:700;font-size:1rem;cursor:pointer}
.lerr{color:#fca5a5;font-size:.83rem;min-height:18px;margin-bottom:6px}
@media(max-width:1100px){.rightpanel{width:260px}.leftpanel{width:230px}}
@media(max-width:900px){.leftpanel,.rail{display:none}.rightpanel{display:none}}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="loginbox">
    <h2>🎛 <span class="lime">PRO-студия</span></h2>
    <p>Расширенный интерфейс для владельца. Введи пароль, чтобы войти.</p>
    <div class="lerr" id="lerr"></div>
    <input type="password" id="lpw" placeholder="Пароль PRO-студии">
    <button id="lbtn">Войти</button>
  </div>
</div>

<div class="topbar">
  <div class="logo"><span class="lime">▶</span> SeedGen PRO</div>
  <div class="navmenu" id="navmenu">
    <button class="navitem active" data-tab="video">Видео</button>
    <button class="navitem" data-tab="image">Изображения</button>
    <button class="navitem soon" data-tab="audio">Аудио · скоро</button>
    <button class="navitem" data-tab="llm">LLM-студия</button>
    <button class="navitem soon" data-tab="editor">Редактор · скоро</button>
    <button class="navitem soon" data-tab="agents">Агенты · скоро</button>
  </div>
  <div class="topright">
    <span class="chip">PRO-доступ</span>
    <button class="btn-s" id="toggleLeft">📁 Проекты</button>
    <a class="btn-s" href="/">← На сайт</a>
  </div>
</div>

<div class="frame">
  <div class="rail">
    <button id="railChat" title="Чаты и проекты">💬</button>
    <button id="railNew" title="Новый проект">➕</button>
    <button id="railFav" title="Избранное (скоро)">⭐</button>
  </div>

  <div class="leftpanel" id="leftpanel">
    <div class="ltabs">
      <button class="ltab" data-lt="chats">Чаты</button>
      <button class="ltab on" data-lt="projects">Проекты</button>
      <button class="ltab" data-lt="tpl">Шаблоны</button>
    </div>
    <div class="llist" id="llist"></div>
  </div>

  <div class="center">
    <div class="stage" id="stage"></div>
    <div class="pbar">
      <div class="pbox">
        <textarea id="prompt" placeholder="Напишите промпт…"></textarea>
        <div class="refrow" id="refrow"></div>
        <div class="prow" id="prow"></div>
      </div>
    </div>
  </div>

  <div class="rightpanel" id="rightpanel"></div>
</div>

<div class="statusbar" id="statusbar">
  <span class="st" id="stext">Генерация…</span>
  <div class="pbar2"><div class="pfill"></div></div>
  <button class="btn-s" id="cancelBtn">Отмена</button>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <button class="mclose" id="mclose">✕</button>
    <div id="mcontent"></div>
    <div class="mactions">
      <button class="btn-s" id="mdownload">⬇ Скачать</button>
      <button class="btn-s" id="mref">📎 В референсы</button>
      <button class="btn-s" id="mnew">Новая генерация</button>
    </div>
  </div>
</div>

<script>
var PW = sessionStorage.getItem('seedgen_pro_pw') || '';
function verify(pw, ok, fail){
  fetch('/api/imagine',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminPassword:pw,verifyOnly:true})})
    .then(function(r){return r.json();})
    .then(function(d){ d.ok?ok():fail('Неверный пароль'); })
    .catch(function(){ fail('Сеть недоступна'); });
}
function gate(){
  if(PW){ verify(PW, function(){ start(); }, function(){ PW=''; sessionStorage.removeItem('seedgen_pro_pw'); document.getElementById('login').classList.remove('hidden'); }); }
  else { document.getElementById('login').classList.remove('hidden'); }
}
document.getElementById('lbtn').onclick=function(){
  var v=document.getElementById('lpw').value.trim();
  if(!v){document.getElementById('lerr').textContent='Введи пароль';return;}
  document.getElementById('lerr').textContent='Проверяем…';
  verify(v,function(){ PW=v; sessionStorage.setItem('seedgen_pro_pw',v); document.getElementById('login').classList.add('hidden'); start(); },function(m){ document.getElementById('lerr').textContent=m; });
};
document.getElementById('lpw').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('lbtn').click();});

var TABS={
  video:{icon:'🎬',name:'Seedance',desc:'Seedance 2.5 снимает цельные сцены до 30 секунд без склейки: модель ведёт действие через смену ракурсов и локаций, сохраняя персонажа и логику. Референсы дают контроль над героем, стилем и всей сценой.',caps:'видео до 30 секунд · до 10 референсов · цельные сцены без склеек',ph:'Напишите промпт и используйте @Image1, @Image2… для референсов',max:35000},
  image:{icon:'🖼',name:'Nano Banana',desc:'Нашумевшая нейросеть от Google: Gemini Flash 3.0 Banana. Отправьте текстовый запрос или добавьте изображения-источники, чтобы получить аккуратный монтаж и стиль.',caps:'до 4 изображений за запрос · стили · точные размеры',ph:'Опишите изображение…',max:5000},
  llm:{icon:'🤖',name:'ChatGPT',desc:'GPT-5 Mini сочетает быстрые ответы, хорошее качество и разумный расход ресурсов. Подходит для сценариев, идей и улучшения промптов.',caps:'быстрый чат · уверенные ответы · работа с текстами',ph:'Попросите: «Придумай 10 идей для Shorts», «Улучши промпт: …»',max:10000}
};
var MODELS={
  video:[['seedance-2-5','Seedance 2.5 (лучшее)'],['seedance-2','Seedance 2.0'],['standard','Standard']],
  image:[['nano-banana-2','Nano Banana 2'],['banana-2-lite','Banana 2 Lite']],
  llm:[['gpt-5-mini','GPT-5 Mini'],['seedgen-prompt','SeedGen Prompt']]
};
var S={'tab':'video','model':{'video':'seedance-2-5','image':'nano-banana-2','llm':'gpt-5-mini'},'quality':'480p','seconds':5,'aspect':'16:9','ires':'1024x1024','icount':1,'istyle':'cinematic','refs':[],'lt':'projects','leftOpen':true};
var SUR={'480p':0,'720p':200,'1080p':300};
var started=false;
function start(){ if(started)return; started=true; render(); }

function price(){ return 199+(S.seconds-5)*30+SUR[S.quality]; }

function render(){
  renderNav(); renderStage(); renderPrompt(); renderRight(); renderLeft();
}
function renderNav(){
  document.querySelectorAll('.navitem').forEach(function(b){
    b.classList.toggle('active',b.getAttribute('data-tab')===S.tab);
  });
}
document.getElementById('navmenu').addEventListener('click',function(e){
  var b=e.target.closest('.navitem'); if(!b)return;
  if(b.classList.contains('soon')){ alert('Этот раздел подключим следом за моделями 🙂'); return; }
  S.tab=b.getAttribute('data-tab'); S.refs=[]; render();
});
document.getElementById('toggleLeft').onclick=function(){ S.leftOpen=!S.leftOpen; document.getElementById('leftpanel').classList.toggle('hidden',!S.leftOpen); };
document.getElementById('railChat').onclick=function(){ S.leftOpen=true; document.getElementById('leftpanel').classList.remove('hidden'); setLt('projects'); };
document.getElementById('railNew').onclick=function(){ document.getElementById('prompt').value=''; S.refs=[]; render(); };
document.getElementById('railFav').onclick=function(){ alert('Избранное появится вместе с базой проектов 🙂'); };

function renderStage(){
  var t=TABS[S.tab];
  document.getElementById('stage').innerHTML=
    '<div class="micon">'+t.icon+'</div>'+
    '<div class="mname">'+t.name+'</div>'+
    '<div class="mdesc">'+t.desc+'</div>'+
    '<div class="mcaps">Основные возможности:</div>'+
    '<div class="mcapline">'+t.caps.split(' · ').map(function(x){return '<b>'+x+'</b>';}).join(' · ')+'</div>';
}
function renderPrompt(){
  var t=TABS[S.tab];
  var p=document.getElementById('prompt');
  p.placeholder=t.ph; p.maxLength=t.max;
  var row=document.getElementById('prow');
  var html='';
  if(S.tab==='video'){
    html+='<button class="pchip" id="attachBtn">📎</button>';
    html+='<button class="pchip" id="chipAspect">'+S.aspect+'</button>';
    html+='<button class="pchip" id="chipQ">'+S.quality+'</button>';
    html+='<button class="pchip" id="chipSec">'+S.seconds+' сек</button>';
    html+='<span class="pcount"><span id="cnt">'+p.value.length+'</span> / '+t.max+'</span>';
    html+='<span class="pprice">'+price()+' ₽</span>';
  }else if(S.tab==='image'){
    html+='<button class="pchip" id="chipRes">'+S.ires+'</button>';
    html+='<button class="pchip" id="chipCount">'+S.icount+' шт</button>';
    html+='<span class="pcount"><span id="cnt">'+p.value.length+'</span> / '+t.max+'</span>';
  }else{
    html+='<span class="pcount"><span id="cnt">'+p.value.length+'</span> / '+t.max+'</span>';
  }
  html+='<button class="psend" id="sendBtn">➤</button>';
  row.innerHTML=html;
  renderRefs();
  var a=document.getElementById('attachBtn');
  if(a)a.onclick=function(){
    var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;
    inp.onchange=function(){ addFiles(inp.files); };
    inp.click();
  };
  var ca=document.getElementById('chipAspect'); if(ca)ca.onclick=cycleAspect;
  var cq=document.getElementById('chipQ'); if(cq)cq.onclick=cycleQ;
  var cs=document.getElementById('chipSec'); if(cs)cs.onclick=cycleSec;
  document.getElementById('sendBtn').onclick=send;
}
document.getElementById('prompt').addEventListener('input',function(){
  var c=document.getElementById('cnt'); if(c)c.textContent=this.value.length;
});
var ASPECTS=['16:9','9:16','1:1','4:3','3:4','21:9'];
var QS=['480p','720p','1080p'];
var SECS=[5,10,15,20,25,30];
function cycleAspect(){ S.aspect=ASPECTS[(ASPECTS.indexOf(S.aspect)+1)%ASPECTS.length]; renderPrompt(); }
function cycleQ(){ S.quality=QS[(QS.indexOf(S.quality)+1)%QS.length]; renderPrompt(); }
function cycleSec(){ S.seconds=SECS[(SECS.indexOf(S.seconds)+1)%SECS.length]; renderPrompt(); }

function addFiles(files){
  Array.prototype.slice.call(files).forEach(function(f){
    if(S.refs.length>=10){alert('До 10 референсов');return;}
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=1024,w=img.width,h=img.height;
        if(w>max||h>max){var k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k);}
        var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
        S.refs.push(c.toDataURL('image/jpeg',0.85).split(',')[1]);
        renderRefs();
      };
      img.src=r.result;
    };
    r.readAsDataURL(f);
  });
}
function renderRefs(){
  var box=document.getElementById('refrow');
  box.innerHTML=S.refs.map(function(b,i){
    return '<span class="refchip"><img src="data:image/jpeg;base64,'+b+'"><button data-i="'+i+'">✕</button></span>';
  }).join('');
  box.querySelectorAll('button').forEach(function(x){
    x.onclick=function(){ S.refs.splice(parseInt(x.getAttribute('data-i'),10),1); renderRefs(); };
  });
}

function renderRight(){
  var rp=document.getElementById('rightpanel');
  var h='<div class="rblock"><h4>Выбор модели</h4><div class="rrow"><select id="modelSel">'+
    MODELS[S.tab].map(function(m){return '<option value="'+m[0]+'"'+(S.model[S.tab]===m[0]?' selected':'')+'>'+m[1]+'</option>';}).join('')+
    '</select></div></div>';
  if(S.tab==='video'){
    h+='<div class="rblock"><h4>🎚 Качество</h4>'+
      '<div class="rrow"><label>Разрешение</label><select id="qSel">'+QS.map(function(q){var s=SUR[q];return '<option value="'+q+'"'+(S.quality===q?' selected':'')+'>'+q+(s?' +'+s+' ₽':' · базовое')+'</option>';}).join('')+'</select></div>'+
      '<div class="rrow"><label>Длительность</label><select id="secSel">'+SECS.map(function(s){return '<option value="'+s+'"'+(S.seconds===s?' selected':'')+'>'+s+' секунд</option>';}).join('')+'</select></div>'+
      '<div class="rrow"><label>Формат</label><select id="aspSel">'+ASPECTS.map(function(a){return '<option value="'+a+'"'+(S.aspect===a?' selected':'')+'>'+a+'</option>';}).join('')+'</select></div>'+
      '<button class="resetbtn" id="resetV">Сбросить ↺</button></div>';
  }
  if(S.tab==='image'){
    h+='<div class="rblock"><h4>🎚 Параметры</h4>'+
      '<div class="rrow"><label>Разрешение</label><select id="iresSel"><option value="512x512">512×512</option><option value="1024x1024">1024×1024</option><option value="1024x1536">1024×1536 (портрет)</option><option value="1536x1024">1536×1024 (ландшафт)</option></select></div>'+
      '<div class="rrow"><label>Количество</label><select id="icountSel"><option value="1">1</option><option value="2">2</option><option value="4">4</option></select></div>'+
      '<div class="rrow"><label>Стиль</label><select id="istyleSel"><option value="cinematic">Кинематограф</option><option value="realistic">Реализм</option><option value="anime">Аниме</option><option value="digital-art">Digital Art</option><option value="photographic">Фото</option></select></div></div>';
  }
  if(S.tab==='llm'){
    h+='<div class="rblock"><h4>✨ Возможности</h4>'+
      '<div class="toggle" id="tgThink"><span class="sw"></span><span><span class="tt">Размышление</span><br><span class="td">Модель рассуждает пошагово перед ответом</span></span></div>'+
      '<div class="toggle on" id="tgPlan"><span class="sw"></span><span><span class="tt">Планирование</span><br><span class="td">Разбивает сложные задачи на план и отслеживает прогресс</span></span></div></div>';
  }
  rp.innerHTML=h;
  var ms=document.getElementById('modelSel'); if(ms)ms.onchange=function(){ S.model[S.tab]=this.value; renderStage(); };
  var q=document.getElementById('qSel'); if(q){q.value=S.quality;q.onchange=function(){S.quality=this.value;renderPrompt();};}
  var sc=document.getElementById('secSel'); if(sc){sc.value=String(S.seconds);sc.onchange=function(){S.seconds=parseInt(this.value,10);renderPrompt();};}
  var as=document.getElementById('aspSel'); if(as){as.value=S.aspect;as.onchange=function(){S.aspect=this.value;renderPrompt();};}
  var rv=document.getElementById('resetV'); if(rv)rv.onclick=function(){ S.quality='480p';S.seconds=5;S.aspect='16:9'; render(); };
  var ir=document.getElementById('iresSel'); if(ir){ir.value=S.ires;ir.onchange=function(){S.ires=this.value;renderPrompt();};}
  var ic=document.getElementById('icountSel'); if(ic){ic.value=String(S.icount);ic.onchange=function(){S.icount=parseInt(this.value,10);renderPrompt();};}
  var ist=document.getElementById('istyleSel'); if(ist){ist.value=S.istyle;ist.onchange=function(){S.istyle=this.value;};}
  ['tgThink','tgPlan'].forEach(function(id){ var el=document.getElementById(id); if(el)el.onclick=function(){ el.classList.toggle('on'); }; });
}

var TPL={
  video:[['shorts','Shorts','Динамичное вертикальное видео для YouTube Shorts, яркие цвета, быстрая смена кадров, цепляющее начало',{'aspect':'9:16','seconds':15}],
    ['ad','Ad','Профессиональная реклама продукта, стильное освещение, акцент на преимуществах, призыв к действию',{'quality':'1080p','seconds':15}],
    ['cinematic','Cinematic','Профессиональное кино с глубиной резкости, атмосферное освещение, драматичные ракурсы',{'quality':'1080p','seconds':30}],
    ['story','Story','Кинематографичная история с развитием сюжета, эмоциональные моменты, красивая операторская работа',{'seconds':30}]],
  image:[['thumbnail','Обложка','Яркая привлекательная обложка для YouTube видео, контрастные цвета, крупный текст'],
    ['poster','Постер','Кинематографичный постер фильма, драматичное освещение, эпичная композиция'],
    ['product','Продукт','Профессиональная фотография продукта на белом фоне, студийное освещение']],
  llm:[['ideas','Идеи','Придумай 10 идей для YouTube Shorts про котов'],
    ['script','Сценарий','Напиши сценарий рекламного ролика на 15 секунд'],
    ['improve','Улучши','Улучши этот промпт: ']]
};
function setLt(lt){ S.lt=lt; document.querySelectorAll('.ltab').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-lt')===lt);}); renderLeft(); }
document.querySelectorAll('.ltab').forEach(function(b){ b.onclick=function(){ setLt(b.getAttribute('data-lt')); }; });

function getProjects(){ try{return JSON.parse(localStorage.getItem('seedgen_pro_projects')||'[]');}catch(e){return[];} }
function saveProjects(p){ localStorage.setItem('seedgen_pro_projects',JSON.stringify(p.slice(0,50))); }
function getChats(){ try{return JSON.parse(localStorage.getItem('seedgen_pro_chats')||'[]');}catch(e){return[];} }
function saveChats(c){ localStorage.setItem('seedgen_pro_chats',JSON.stringify(c.slice(0,30))); }

function renderLeft(){
  var box=document.getElementById('llist');
  if(S.lt==='projects'){
    var p=getProjects();
    if(!p.length){ box.innerHTML='<div class="lempty">Проектов пока нет.<br>Отправьте первую генерацию — и она появится здесь.</div>'; return; }
    box.innerHTML=p.map(function(it,i){
      var dot=it.status==='succeeded'?'ok':(it.status==='failed'?'err':'gen');
      return '<div class="litem" data-i="'+i+'"><h5><span class="dot '+dot+'"></span>'+it.icon+' '+it.title+'</h5><p>'+it.prompt+'</p></div>';
    }).join('');
    box.querySelectorAll('.litem').forEach(function(el){
      el.onclick=function(){ var it=p[parseInt(el.getAttribute('data-i'),10)]; if(it&&it.url){ openResult({videoUrl:it.type==='video'?it.url:null,imageUrl:it.type==='image'?it.url:null,audioUrl:it.type==='audio'?it.url:null}); } };
    });
  }else if(S.lt==='chats'){
    var c=getChats();
    if(!c.length){ box.innerHTML='<div class="lempty">Чатов пока нет.<br>Напишите сообщение в LLM-студии — и создастся новый чат.</div>'; return; }
    box.innerHTML=c.map(function(it,i){ return '<div class="litem" data-i="'+i+'"><h5>🤖 '+it.title+'</h5><p>'+it.last+'</p></div>'; }).join('');
    box.querySelectorAll('.litem').forEach(function(el){
      el.onclick=function(){ var it=c[parseInt(el.getAttribute('data-i'),10); ]};
    });
  }else{
    var list=TPL[S.tab]||[];
    if(!list.length){ box.innerHTML='<div class="lempty">Шаблоны для этого раздела появятся скоро.</div>'; return; }
    box.innerHTML=list.map(function(t,i){ return '<div class="litem" data-i="'+i+'"><h5>'+t[1]+'</h5><p>'+t[2].slice(0,70)+'…</p></div>'; }).join('');
    box.querySelectorAll('.litem').forEach(function(el){
      el.onclick=function(){
        var t=list[parseInt(el.getAttribute('data-i'),10)];
        document.getElementById('prompt').value=t[2];
        if(S.tab==='video'&&t[3]){ if(t[3].aspect)S.aspect=t[3].aspect; if(t[3].seconds)S.seconds=t[3].seconds; if(t[3].quality)S.quality=t[3].quality; }
        render();
        var c=document.getElementById('cnt'); if(c)c.textContent=t[2].length;
      };
    });
  }
}

var taskId=null,poll=null,lastUrl=null,lastType=null;
function send(){
  var prompt=document.getElementById('prompt').value.trim();
  if(!prompt){ alert('Напиши промпт 🙂'); return; }
  if(S.tab==='llm'){ sendAI(prompt); return; }
  var settings={prompt:prompt,adminPassword:PW};
  var icon='🎬',type='video';
  if(S.tab==='video'){
    settings.service='text2video';
    settings.model=S.model.video; settings.resolution=S.quality; settings.aspect=S.aspect; settings.duration=S.seconds;
    if(S.refs.length)settings.refs=S.refs;
  }else{
    settings.service='text2image'; icon='🖼'; type='image';
    settings.model=S.model.image; settings.resolution=S.ires; settings.count=S.icount; settings.style=S.istyle;
    if(S.refs.length)settings.refs=S.refs;
  }
  var p=getProjects();
  p.unshift({icon:icon,type:type,title:TABS[S.tab].name,prompt:prompt,status:'gen',ts:Date.now(),url:null});
  saveProjects(p); renderLeft();
  document.getElementById('statusbar').classList.add('show');
  document.getElementById('stext').textContent='Отправка запроса…';
  fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(settings)})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.error)throw new Error(d.error);
      taskId=d.taskId;
      document.getElementById('stext').textContent='Генерация…';
      poll=setInterval(function(){
        fetch('/api/status?taskId='+encodeURIComponent(taskId)).then(function(r){return r.json();}).then(function(st){
          if(st.status==='succeeded'){
            clearInterval(poll);poll=null;
            document.getElementById('statusbar').classList.remove('show');
            var url=st.videoUrl||st.imageUrl||st.audioUrl||null;
            var pp=getProjects(); if(pp.length){pp[0].status='succeeded';pp[0].url=url;saveProjects(pp);renderLeft();}
            openResult(st);
          }else if(st.status==='failed'){
            clearInterval(poll);poll=null;
            document.getElementById('statusbar').classList.remove('show');
            var pf=getProjects(); if(pf.length){pf[0].status='failed';saveProjects(pf);renderLeft();}
            alert('Генерация не удалась: '+(st.error||'нейросеть отклонила запрос'));
          }
        }).catch(function(){});
      },5000);
    })
    .catch(function(e){
      document.getElementById('statusbar').classList.remove('show');
      var pf=getProjects(); if(pf.length){pf[0].status='failed';saveProjects(pf);renderLeft();}
      alert('Ошибка: '+e.message);
    });
}
document.getElementById('cancelBtn').onclick=function(){ if(poll)clearInterval(poll); poll=null; document.getElementById('statusbar').classList.remove('show'); };

function sendAI(prompt){
  var btn=document.getElementById('sendBtn'); btn.disabled=true;
  document.getElementById('statusbar').classList.add('show');
  document.getElementById('stext').textContent='LLM думает…';
  fetch('/api/ai-helper',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt,adminPassword:PW})})
    .then(function(r){return r.json();})
    .then(function(d){
      document.getElementById('statusbar').classList.remove('show');
      btn.disabled=false;
      var text=d.result||('Ошибка: '+(d.error||'неизвестно'));
      var c=getChats();
      c.unshift({title:prompt.slice(0,40),last:text.slice(0,60),ts:Date.now()});
      saveChats(c); setLt('chats');
      openResult({aiText:text});
    })
    .catch(function(e){ document.getElementById('statusbar').classList.remove('show'); btn.disabled=false; alert('Ошибка: '+e.message); });
}

function openResult(st){
  var box=document.getElementById('mcontent');
  box.innerHTML='';
  lastUrl=st.videoUrl||st.imageUrl||st.audioUrl||null;
  lastType=st.videoUrl?'video':(st.imageUrl?'image':(st.audioUrl?'audio':null));
  if(st.videoUrl){ var v=document.createElement('video');v.src=st.videoUrl;v.controls=true;box.appendChild(v); }
  if(st.imageUrl){ var im=document.createElement('img');im.src=st.imageUrl;box.appendChild(im); }
  if(st.audioUrl){ var au=document.createElement('audio');au.src=st.audioUrl;au.controls=true;box.appendChild(au); }
  if(st.aiText){ var pre=document.createElement('div');pre.style.cssText='white-space:pre-wrap;line-height:1.6;color:#e5e7eb';pre.textContent=st.aiText;box.appendChild(pre); }
  document.getElementById('modal').classList.add('show');
}
document.getElementById('mclose').onclick=function(){document.getElementById('modal').classList.remove('show');};
document.getElementById('mnew').onclick=function(){document.getElementById('modal').classList.remove('show');document.getElementById('prompt').value='';S.refs=[];render();};
document.getElementById('mdownload').onclick=function(){ if(lastUrl){window.open(lastUrl,'_blank');}else{alert('Нечего скачивать 🙂');} };
document.getElementById('mref').onclick=function(){
  if(!lastUrl||lastType!=='image'){alert('В референсы можно добавить изображение 🙂');return;}
  fetch(lastUrl).then(function(r){return r.blob();}).then(function(b){
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=1024,w=img.width,h=img.height;
        if(w>max||h>max){var k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k);}
        var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
        S.refs.push(c.toDataURL('image/jpeg',0.85).split(',')[1]);
        document.getElementById('modal').classList.remove('show');
        S.tab='video'; render();
      };
      img.src=r.result;
    };
    r.readAsDataURL(b);
  }).catch(function(){alert('Не удалось добавить референс');});
};

gate();
</script>
