<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Оживи картинку — SeedGen</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0c08;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
nav{width:100%;max-width:1000px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;background:#111408;border:1px solid #232a18;border-radius:999px;padding:12px 22px;margin-bottom:36px}
.logo{font-weight:700;font-size:1.15rem}
.logo span{color:#A3E635}
.links a{color:#d1d5db;text-decoration:none;margin-left:16px;font-size:.95rem}
.links a:hover{color:#A3E635}
.links a.active{color:#A3E635;font-weight:700}
h1{font-size:2.2rem;margin:30px 0 8px;color:#A3E635;text-align:center}
.warn{width:100%;max-width:640px;background:rgba(255,140,0,.12);border:1px solid rgba(255,140,0,.4);color:#ffb066;border-radius:12px;padding:12px;margin:12px 0;font-size:.9rem;text-align:center}
.card{width:100%;max-width:640px;background:#101308;border:1px solid rgba(163,230,53,.35);border-radius:24px;padding:24px;margin-bottom:20px}
label{display:block;margin:12px 0 8px;color:#c3c9b4;font-size:.95rem}
input{width:100%;background:#0b0e07;border:1px solid #262d16;border-radius:10px;color:#fff;padding:12px;font-size:1rem;outline:none}
button{margin-top:16px;width:100%;padding:14px;border:none;border-radius:999px;background:#A3E635;color:#0a0c08;font-size:1.05rem;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#status{margin-top:12px;min-height:20px;color:#9ca3af;text-align:center}
#preview{display:none;width:100%;border-radius:12px;margin-top:12px}
#result{margin-top:16px;display:none}
#result video{width:100%;border-radius:12px}
footer{margin-top:auto;padding:26px 0 10px;color:#5b6152;font-size:.85rem;text-align:center;line-height:1.7}
footer a{color:#9ca3af;text-decoration:none}
</style>
</head>
<body>
<nav>
  <div class="logo"><span>▶</span> SeedGen</div>
  <div class="links">
    <a href="/">Генерация</a>
    <a class="active" href="/photo.html">Оживи картинку</a>
    <a href="/cartoon.html">Мультфильм</a>
    <a href="/avatar.html">Аватар</a>
  </div>
</nav>

<h1>🐱 Оживи картинку</h1>
<p class="warn">⚠️ Фото с людьми не пройдут — нейросеть защищает людей от дипфейков. Оживляем: питомцев, природу, игрушки, рисунки и арт.</p>
<div class="card">
<label>Пароль (пока только для своих)</label>
<input id="pass" type="password" placeholder="Секретный пароль"/>
<label>Выбери картинку (JPG/PNG)</label>
<input id="file" type="file" accept="image/*"/>
<img id="preview"/>
<button id="btn">Оживить</button>
<div id="status"></div>
<div id="result"><video id="video" controls></video></div>
</div>

<footer>
  Самозанятый Малкова Ольга Аркадьевна, ИНН 420900493994<br>
  <a href="/legal.html">Оферта</a> · <a href="/legal.html">Политика конфиденциальности</a> · <a href="/legal.html">Контакты</a>
</footer>

<script>
var fileInput=document.getElementById('file');
var preview=document.getElementById('preview');
var imageData=null;

fileInput.addEventListener('change',function(){
  var f=fileInput.files[0];
  if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1024;
      var w=img.width,h=img.height;
      if(w>max||h>max){var k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k);}
      var canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      var d=canvas.toDataURL('image/jpeg',0.85);
      imageData=d.split(',')[1];
      preview.src=d;
      preview.style.display='block';
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(f);
});

document.getElementById('btn').addEventListener('click',function(){
  var btn=document.getElementById('btn');
  var pass=document.getElementById('pass').value;
  if(!imageData){alert('Сначала выбери картинку');return;}
  if(!pass){alert('Введи пароль');return;}
  btn.disabled=true;
  document.getElementById('status').textContent='Отправляем картинку...';
  fetch('/api/animate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:imageData,prompt:'Animate this image, cinematic motion',adminPassword:pass})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.error){throw new Error(d.error);}
      document.getElementById('status').textContent='Оживляем... 1–3 минуты ⏳';
      poll(d.taskId,btn);
    })
    .catch(function(e){
      document.getElementById('status').textContent='Ошибка: '+e.message;
      btn.disabled=false;
    });
});

function poll(taskId,btn){
  var timer=setInterval(function(){
    fetch('/api/status?taskId='+encodeURIComponent(taskId))
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.status==='succeeded'){
          clearInterval(timer);
          document.getElementById('video').src=d.videoUrl;
          document.getElementById('result').style.display='block';
          document.getElementById('status').textContent='Готово! ✅';
          btn.disabled=false;
        }else if(d.status==='failed'){
          clearInterval(timer);
          document.getElementById('status').textContent='Ошибка: '+(d.error||'попробуй другую картинку');
          btn.disabled=false;
        }else{
          document.getElementById('status').textContent='Оживляем... ⏳';
        }
      })
      .catch(function(){});
  },5000);
}
</script>
</body>
</html>
