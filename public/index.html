<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SeedGen — генерация видео нейросетью</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0b0b14;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:2.4rem;margin:40px 0 8px;background:linear-gradient(90deg,#7c5cff,#00d4ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.sub{color:#8a8aa3;margin-bottom:36px;text-align:center}
.card{width:100%;max-width:640px;background:#151522;border:1px solid #26263a;border-radius:16px;padding:24px}
label{display:block;margin-bottom:8px;color:#b9b9cf;font-size:.95rem}
textarea{width:100%;height:110px;background:#0e0e18;border:1px solid #2c2c44;border-radius:10px;color:#fff;padding:12px;font-size:1rem;resize:vertical;outline:none}
textarea:focus{border-color:#7c5cff}
button{margin-top:16px;width:100%;padding:14px;border:none;border-radius:10px;background:linear-gradient(90deg,#7c5cff,#00d4ff);color:#fff;font-size:1.05rem;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#status{margin-top:14px;min-height:20px;color:#8a8aa3;text-align:center}
#result{margin-top:20px;display:none}
#result video{width:100%;border-radius:12px}
footer{margin-top:auto;padding:30px 0 10px;color:#55556e;font-size:.85rem}
</style>
</head>
<body>
<h1>🎬 SeedGen</h1>
<p class="sub">Генерация видео с помощью нейросети Seedance 2.5</p>

<div class="card">
  <label for="prompt">Опиши, какое видео хочешь создать:</label>
  <textarea id="prompt" placeholder="Например: кот в космосе летит на ракете, кинематографичный стиль"></textarea>
  <button id="btn">Сгенерировать видео</button>
  <div id="status"></div>
  <div id="result"><video id="video" controls></video></div>
</div>

<footer>© 2025 SeedGen · Работает на ИИ</footer>

<script>
const btn=document.getElementById('btn');
const statusEl=document.getElementById('status');
const resultEl=document.getElementById('result');
const videoEl=document.getElementById('video');

btn.addEventListener('click',async()=>{
  const prompt=document.getElementById('prompt').value.trim();
  if(!prompt){alert('Введите описание видео');return;}
  btn.disabled=true;
  resultEl.style.display='none';
  setStatus('Отправляем запрос...');
  try{
    const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||'Ошибка сервера');
    setStatus('Видео генерируется... это займёт 1–3 минуты ⏳');
    poll(data.taskId);
  }catch(e){
    setStatus('Ошибка: '+e.message);
    btn.disabled=false;
  }
});

function setStatus(t){statusEl.textContent=t;}

async function poll(taskId){
  const timer=setInterval(async()=>{
    try{
      const r=await fetch('/api/status?taskId='+encodeURIComponent(taskId));
      const data=await r.json();
      if(data.status==='succeeded'){
        clearInterval(timer);
        videoEl.src=data.videoUrl;
        resultEl.style.display='block';
        setStatus('Готово! ✅');
        btn.disabled=false;
      }else if(data.status==='failed'){
        clearInterval(timer);
        setStatus('Ошибка генерации: '+(data.error||'попробуйте другой запрос'));
        btn.disabled=false;
      }else{
        setStatus('Видео генерируется... ⏳');
      }
    }catch(e){}
  },5000);
}
</script>
</body>
</html>
